services:
  # SmartPack Backend API
  - type: web
    name: smartpack-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    plan: free
    region: singapore
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: GEMINI_API_KEY
        sync: false

  # SmartPack Frontend (React / Vite Static Site)
  - type: static
    name: smartpack-frontend
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://smartpack-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
